<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Radial Gradients for Deep Executive Glow -->
    <radialGradient id="bgGlowCyan" cx="25%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00A3E0" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#050B17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlowEmerald" cx="75%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050B17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgGlowPurple" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050B17" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D192E" />
      <stop offset="100%" stop-color="#060C18" />
    </linearGradient>
    <linearGradient id="excelHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#107C41" />
      <stop offset="100%" stop-color="#0B5A2F" />
