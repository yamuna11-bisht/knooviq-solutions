<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glows -->
    <radialGradient id="evolveGlowPurple" cx="25%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050B17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="evolveGlowCyan" cx="75%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00A3E0" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#050B17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="evolveGlowEmerald" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#050B17" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="cardBgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E172B" />
      <stop offset="100%" stop-color="#070D1B" />
    </linearGradient>
    <linearGradient id="formHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
