<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <radialGradient id="pipGlowCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00A3E0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050B17" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pipGlowPurple" cx="80%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050B17" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pipHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1931" />
      <stop offset="50%" stop-color="#0077B6" />
      <stop offset="100%" stop-color="#00A3E0" />
    </linearGradient>
    <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="33%" stop-color="#8B5CF6" />
      <stop offset="66%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="pipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Deep Base -->
  <rect width="1200" height="650" fill="#050B17" />
  <rect width="1200" height="650" fill="url(#pipGlowCyan)" />
  <rect width="1200" height="650" fill="url(#pipGlowPurple)" />

  <!-- Technical Grid -->
  <g stroke="#1E293B" stroke-width="0.75" opacity="0.3">
    <line x1="150" y1="0" x2="150" y2="650" />
    <line x1="450" y1="0" x2="450" y2="650" />
    <line x1="750" y1="0" x2="750" y2="650" />
    <line x1="1050" y1="0" x2="1050" y2="650" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="560" x2="1200" y2="560" />
  </g>

  <!-- Top System Header Console -->
  <rect x="40" y="30" width="1120" height="52" rx="14" fill="#0A1424" stroke="#334155" stroke-width="1.5" />
  <circle cx="70" cy="56" r="6" fill="#EF4444" opacity="0.85" />
  <circle cx="90" cy="56" r="6" fill="#F59E0B" opacity="0.85" />
  <circle cx="110" cy="56" r="6" fill="#10B981" opacity="0.85" />
  
  <text x="140" y="60" fill="#94A3B8" font-family="monospace" font-size="12" font-weight="bold">
    knooviq-kernel://automation-studio/execution-pipeline-engine
  </text>
  
  <rect x="910" y="42" width="230" height="28" rx="6" fill="#00A3E0" fill-opacity="0.15" stroke="#00A3E0" stroke-opacity="0.4" />
  <circle cx="928" cy="56" r="4" fill="#10B981" />
  <text x="944" y="60" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">
    AUTONOMOUS PIPELINE READY
  </text>

  <!-- Connecting Bus Line Through All 4 Stages -->
  <path d="M 175,320 L 1025,320" stroke="url(#flowLineGrad)" stroke-width="4" stroke-dasharray="10,6" fill="none" opacity="0.8" />

  <!-- =========================================================================
       STAGE A: RECORD & TEMPLATE DESIGN
       ========================================================================= -->
  <g transform="translate(45, 110)">
    <rect x="0" y="0" width="260" height="430" rx="14" fill="#080F1E" stroke="#00A3E0" stroke-width="1.5" />
    <!-- Stage Header -->
    <rect x="0" y="0" width="260" height="46" rx="14" fill="#0F172A" />
    <rect x="0" y="32" width="260" height="14" fill="#0F172A" />
    <rect x="12" y="10" width="60" height="24" rx="6" fill="#00A3E0" fill-opacity="0.2" stroke="#00A3E0" stroke-width="1" />
    <text x="22" y="26" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">STAGE A</text>
    <text x="82" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Record Flow</text>

    <!-- Stage Body -->
    <g transform="translate(14, 60)" font-family="sans-serif">
      <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="bold">Visual Screen Capture</text>
      <text x="0" y="36" fill="#94A3B8" font-size="10">Captures SAP screens, custom T-Codes, and standard BAPI parameters.</text>

      <!-- Mock UI Window -->
      <rect x="0" y="56" width="232" height="150" rx="8" fill="#0B132B" stroke="#1E293B" />
      <g transform="translate(12, 76)" font-family="monospace" font-size="9">
        <text x="0" y="0" fill="#64748B">T-CODE SNIFFER:</text>
        <text x="0" y="18" fill="#38BDF8">STANDARD_JOURNAL</text>
        <line x1="0" y1="28" x2="208" y2="28" stroke="#1E293B" />
        <text x="0" y="44" fill="#94A3B8">Fields Captured:</text>
        <text x="0" y="60" fill="#34D399">• Header: DocDate, CoCode</text>
        <text x="0" y="76" fill="#34D399">• Items: GL_Acct, CostCenter</text>
      </g>

      <!-- Stage Pill -->
      <rect x="0" y="222" width="232" height="70" rx="8" fill="#00A3E0" fill-opacity="0.1" stroke="#00A3E0" stroke-opacity="0.3" />
      <text x="12" y="244" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="bold">CODE-FREE TEMPLATE</text>
      <text x="12" y="262" fill="#E2E8F0" font-size="10">Zero custom ABAP required.</text>
      <text x="12" y="278" fill="#94A3B8" font-size="9">Safe GUI interaction mode.</text>
    </g>

    <!-- Bottom Indicator -->
    <circle cx="130" cy="405" r="5" fill="#00A3E0" filter="url(#pipGlow)" />
  </g>

  <!-- =========================================================================
       STAGE B: EXCEL DATA MAPPING
       ========================================================================= -->
  <g transform="translate(330, 110)">
    <rect x="0" y="0" width="260" height="430" rx="14" fill="#080F1E" stroke="#8B5CF6" stroke-width="1.5" />
    <!-- Stage Header -->
    <rect x="0" y="0" width="260" height="46" rx="14" fill="#0F172A" />
    <rect x="0" y="32" width="260" height="14" fill="#0F172A" />
    <rect x="12" y="10" width="60" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1" />
    <text x="22" y="26" fill="#C084FC" font-family="monospace" font-size="10" font-weight="bold">STAGE B</text>
    <text x="82" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Excel Mapping</text>

    <!-- Stage Body -->
    <g transform="translate(14, 60)" font-family="sans-serif">
      <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="bold">Cell-Level Binding</text>
      <text x="0" y="36" fill="#94A3B8" font-size="10">Binds Excel worksheet columns directly into SAP screen fields.</text>

      <!-- Mock UI Window -->
      <rect x="0" y="56" width="232" height="150" rx="8" fill="#0B132B" stroke="#1E293B" />
      <g transform="translate(10, 76)" font-family="monospace" font-size="9">
        <text x="0" y="0" fill="#A78BFA">EXCEL COL -&gt; SAP FIELD</text>
        <line x1="0" y1="10" x2="212" y2="10" stroke="#1E293B" />
        <text x="0" y="28" fill="#E2E8F0">Col_A -&gt; BKPF_BLDAT</text>
        <text x="0" y="48" fill="#E2E8F0">Col_B -&gt; BKPF_BUKRS</text>
        <text x="0" y="68" fill="#E2E8F0">Col_C -&gt; BSEG_HKONT</text>
        <text x="0" y="88" fill="#34D399">• Loop Binding: Active</text>
      </g>

      <!-- Stage Pill -->
      <rect x="0" y="222" width="232" height="70" rx="8" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-opacity="0.3" />
      <text x="12" y="244" fill="#C084FC" font-family="monospace" font-size="9" font-weight="bold">DYNAMIC TABLE LOOPS</text>
      <text x="12" y="262" fill="#E2E8F0" font-size="10">Multi-line item flexibility.</text>
      <text x="12" y="278" fill="#94A3B8" font-size="9">Header-to-item hierarchy.</text>
    </g>

    <!-- Bottom Indicator -->
    <circle cx="130" cy="405" r="5" fill="#8B5CF6" filter="url(#pipGlow)" />
  </g>

  <!-- =========================================================================
       STAGE C: PRE-FLIGHT VALIDATION
       ========================================================================= -->
  <g transform="translate(615, 110)">
    <rect x="0" y="0" width="260" height="430" rx="14" fill="#080F1E" stroke="#10B981" stroke-width="1.5" />
    <!-- Stage Header -->
    <rect x="0" y="0" width="260" height="46" rx="14" fill="#0F172A" />
    <rect x="0" y="32" width="260" height="14" fill="#0F172A" />
    <rect x="12" y="10" width="60" height="24" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="22" y="26" fill="#34D399" font-family="monospace" font-size="10" font-weight="bold">STAGE C</text>
    <text x="82" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Simulation</text>

    <!-- Stage Body -->
    <g transform="translate(14, 60)" font-family="sans-serif">
      <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="bold">Zero-Commit Validation</text>
      <text x="0" y="36" fill="#94A3B8" font-size="10">Simulates postings against SAP business logic before database commit.</text>

      <!-- Mock UI Window -->
      <rect x="0" y="56" width="232" height="150" rx="8" fill="#0B132B" stroke="#1E293B" />
      <g transform="translate(10, 76)" font-family="monospace" font-size="9">
        <text x="0" y="0" fill="#34D399">SIMULATION AUDIT LOG:</text>
        <line x1="0" y1="10" x2="212" y2="10" stroke="#1E293B" />
        <text x="0" y="28" fill="#E2E8F0">Cost Center: Verified</text>
        <text x="0" y="48" fill="#E2E8F0">Posting Period: Open</text>
        <text x="0" y="68" fill="#E2E8F0">Auth Profile: S_TABU_DIS</text>
        <text x="0" y="88" fill="#34D399">• Zero Errors Detected</text>
      </g>

      <!-- Stage Pill -->
      <rect x="0" y="222" width="232" height="70" rx="8" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3" />
      <text x="12" y="244" fill="#34D399" font-family="monospace" font-size="9" font-weight="bold">ZERO POSTING ERRORS</text>
      <text x="12" y="262" fill="#E2E8F0" font-size="10">Catches bad data upstream.</text>
      <text x="12" y="278" fill="#94A3B8" font-size="9">Preserves database hygiene.</text>
    </g>

    <!-- Bottom Indicator -->
    <circle cx="130" cy="405" r="5" fill="#10B981" filter="url(#pipGlow)" />
  </g>

  <!-- =========================================================================
       STAGE D: MASS ERP POSTING
       ========================================================================= -->
  <g transform="translate(895, 110)">
    <rect x="0" y="0" width="260" height="430" rx="14" fill="#080F1E" stroke="#3B82F6" stroke-width="1.5" />
    <!-- Stage Header -->
    <rect x="0" y="0" width="260" height="46" rx="14" fill="#0F172A" />
    <rect x="0" y="32" width="260" height="14" fill="#0F172A" />
    <rect x="12" y="10" width="60" height="24" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1" />
    <text x="22" y="26" fill="#60A5FA" font-family="monospace" font-size="10" font-weight="bold">STAGE D</text>
    <text x="82" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">Mass Commit</text>

    <!-- Stage Body -->
    <g transform="translate(14, 60)" font-family="sans-serif">
      <text x="0" y="16" fill="#E2E8F0" font-size="12" font-weight="bold">Direct S/4HANA Sync</text>
      <text x="0" y="36" fill="#94A3B8" font-size="10">Executes high-volume batches with immediate cell writeback in Excel.</text>

      <!-- Mock UI Window -->
      <rect x="0" y="56" width="232" height="150" rx="8" fill="#0B132B" stroke="#1E293B" />
      <g transform="translate(10, 76)" font-family="monospace" font-size="9">
        <text x="0" y="0" fill="#60A5FA">EXECUTION STATUS:</text>
        <line x1="0" y1="10" x2="212" y2="10" stroke="#1E293B" />
        <text x="0" y="28" fill="#E2E8F0">SAP Doc: BKPF_POSTED</text>
        <text x="0" y="48" fill="#E2E8F0">Excel Log: Appended</text>
        <text x="0" y="68" fill="#E2E8F0">Audit Record: Secured</text>
        <text x="0" y="88" fill="#34D399">• Batch Synchronized</text>
      </g>

      <!-- Stage Pill -->
      <rect x="0" y="222" width="232" height="70" rx="8" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-opacity="0.3" />
      <text x="12" y="244" fill="#60A5FA" font-family="monospace" font-size="9" font-weight="bold">REAL-TIME WRITEBACK</text>
      <text x="12" y="262" fill="#E2E8F0" font-size="10">Instant document numbering.</text>
      <text x="12" y="278" fill="#94A3B8" font-size="9">Role-level traceability.</text>
    </g>

    <!-- Bottom Indicator -->
    <circle cx="130" cy="405" r="5" fill="#3B82F6" filter="url(#pipGlow)" />
  </g>

  <!-- Bottom Console Status Ribbon -->
  <rect x="40" y="565" width="1120" height="50" rx="12" fill="#0A1424" stroke="#1E293B" />
  <circle cx="68" cy="590" r="4" fill="#10B981" />
  <text x="85" y="594" fill="#94A3B8" font-family="monospace" font-size="11">
    KNOOVIQ EXECUTION PIPELINE • <tspan fill="#34D399" font-weight="bold">FULLY COMPLIANT WITH SAP CLEAN CORE GOVERNANCE</tspan>
  </text>
  <text x="910" y="594" fill="#64748B" font-family="monospace" font-size="11">
    ENTERPRISE EDITION
  </text>
</svg>
